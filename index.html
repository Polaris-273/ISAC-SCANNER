<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAC Terminal - Access Control</title>
    <style>
        :root {
            --isac-orange: #ff6a00;
            --isac-dark: #0c0f12;
            --isac-panel: #141a21;
            --isac-alert: #ff2a00;
            --isac-green: #00ff66;
            --isac-text: #e0e6ed;
        }

        body {
            background-color: var(--isac-dark);
            color: var(--isac-text);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Division Visual Elements */
        .terminal-container {
            width: 100%;
            max-width: 500px;
            background: var(--isac-panel);
            border: 2px solid var(--isac-orange);
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.2);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .header {
            border-bottom: 1px solid var(--isac-orange);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .isac-logo {
            color: var(--isac-orange);
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        /* RFID Ring Effect */
        .ring-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }

        .isac-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px dashed var(--isac-orange);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: spin 12s linear infinite;
            transition: all 0.3s ease;
        }

        .isac-ring-inner {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--isac-orange);
            position: absolute;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* State Modifiers */
        .status-granted .isac-ring {
            border-color: var(--isac-green);
            box-shadow: 0 0 30px var(--isac-green);
        }

        .status-denied .isac-ring {
            border-color: var(--isac-alert);
            box-shadow: 0 0 30px var(--isac-alert);
        }

        /* HUD Status Text */
        .status-display {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--isac-orange);
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Controls & Form */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"] {
            background: #000;
            border: 1px solid var(--isac-orange);
            color: var(--isac-orange);
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
        }

        button {
            background: var(--isac-orange);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        button:hover {
            background: #ff8533;
        }

        /* Registered Devices List */
        .device-list {
            margin-top: 20px;
            border-top: 1px dashed var(--isac-orange);
            padding-top: 10px;
            font-size: 0.85rem;
        }

        .device-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="terminal-container" id="terminal">
    <div class="header">
        <span class="isac-logo">// ISAC v2.1</span>
        <span id="system-time">00:00:00</span>
    </div>

    <div class="status-display" id="status-text">INITIALIZING SCANNER...</div>

    <div class="ring-container">
        <div class="isac-ring">
            <div class="isac-ring-inner"></div>
        </div>
    </div>

    <div class="controls">
        <button id="scan-btn" onclick="toggleScanner()">START SCANNER</button>
        
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <input type="text" id="agent-name" placeholder="Agent Designation" style="flex: 1;">
            <button onclick="enableRegistrationMode()" style="background: #333; color: #fff;">REGISTER NEXT TAG</button>
        </div>
    </div>

    <div class="device-list">
        <div style="color: var(--isac-orange); margin-bottom: 5px;">AUTHORIZED AGENT KEYS</div>
        <div id="registered-keys"></div>
    </div>
</div>

<script>
    let registeredDevices = JSON.parse(localStorage.getItem('isac_devices')) || {};
    let isRegistering = false;
    let ndefReader = null;

    // Synthetic ISAC Voice System (SpeechSynthesis API)
    function speakISAC(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Adjust pitch/rate to approximate robotic/ISAC cadence
            utterance.pitch = 0.8;
            utterance.rate = 0.9;
            
            // Try to find a clear English male/monotone voice
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('en') && v.name.includes('Male')) || voices[0];
            if (preferredVoice) utterance.voice = preferredVoice;

            window.speechSynthesis.speak(utterance);
        }
    }

    // Update UI elements
    function updateClock() {
        document.getElementById('system-time').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    function renderDeviceList() {
        const container = document.getElementById('registered-keys');
        container.innerHTML = '';
        
        const keys = Object.keys(registeredDevices);
        if (keys.length === 0) {
            container.innerHTML = '<div class="device-item">No agent keys bound.</div>';
            return;
        }

        keys.forEach(serial => {
            const div = document.createElement('div');
            div.className = 'device-item';
            div.innerHTML = `<span>${registeredDevices[serial]}</span><code>${serial.substring(0, 8)}...</code>`;
            container.appendChild(div);
        });
    }

    // Toggle scanning session
    async function toggleScanner() {
        if (!('NDEFReader' in window)) {
            alert('Web NFC is not supported on this browser/device. Ensure you are using Chrome on Android with NFC enabled.');
            return;
        }

        try {
            if (!ndefReader) {
                ndefReader = new NDEFReader();
                await ndefReader.scan();
                
                ndefReader.onreading = handleNFCScan;
                ndefReader.onreadingerror = () => triggerAccessDenied("READ ERROR");

                document.getElementById('scan-btn').innerText = "SCANNER ACTIVE";
                document.getElementById('scan-btn').style.background = "var(--isac-green)";
                document.getElementById('status-text').innerText = "SYSTEM READY - TAP DEVICE";
                speakISAC("ISAC system online. Scanning active.");
            }
        } catch (error) {
            console.error(error);
            document.getElementById('status-text').innerText = "ACCESS ERROR";
            speakISAC("Error establishing NFC link.");
        }
    }

    // Enable one-time registration mode
    function enableRegistrationMode() {
        const nameInput = document.getElementById('agent-name').value.trim();
        if (!nameInput) {
            alert('Enter an Agent Designation first.');
            return;
        }
        isRegistering = true;
        document.getElementById('status-text').innerText = "TAP DEVICE TO REGISTER";
        speakISAC("Registration mode active. Present credential.");
    }

    // Processing incoming scans
    function handleNFCScan(event) {
        const serialNumber = event.serialNumber;
        
        if (isRegistering) {
            const agentName = document.getElementById('agent-name').value.trim() || "Agent";
            registeredDevices[serialNumber] = agentName;
            localStorage.setItem('isac_devices', JSON.stringify(registeredDevices));
            
            renderDeviceList();
            isRegistering = false;
            document.getElementById('agent-name').value = '';
            
            triggerAccessGranted(`REGISTERED: ${agentName}`);
            speakISAC(`Credential registered. Welcome, Agent ${agentName}.`);
        } else {
            if (registeredDevices[serialNumber]) {
                const agentName = registeredDevices[serialNumber];
                triggerAccessGranted(`ACCESS GRANTED - ${agentName}`);
                speakISAC(`Access granted. Welcome back, Agent ${agentName}.`);
            } else {
                triggerAccessDenied("UNAUTHORIZED CREDENTIAL");
                speakISAC("Warning: Unauthorized credential detected. Access denied.");
            }
        }
    }

    // HUD Visual Effects
    function triggerAccessGranted(message) {
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('status-text');
        
        terminal.className = "terminal-container status-granted";
        statusText.innerText = message;

        setTimeout(() => {
            terminal.className = "terminal-container";
            statusText.innerText = "SYSTEM READY - TAP DEVICE";
        }, 3000);
    }

    function triggerAccessDenied(message) {
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('status-text');
        
        terminal.className = "terminal-container status-denied";
        statusText.innerText = message;

        setTimeout(() => {
            terminal.className = "terminal-container";
            statusText.innerText = "SYSTEM READY - TAP DEVICE";
        }, 3000);
    }

    // Initial display state
    renderDeviceList();
</script>
</body>
</html>
